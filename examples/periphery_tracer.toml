name = "tracer_serial"
description = "First end-to-end tracer path: Serial peer with PING/PONG"

[channel.uart1]
type = "serial_peer"
port = "/dev/ttyUSB1"
baud = 9600
parity = "none"
stop_bits = 1
echo = false

[[channel.uart1.replies]]
match = "PING\n"
response = "PONG\n"

[[channel.uart1.replies]]
match = "STATUS\n"
response = "OK:GW5AT138\n"
